<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>order-status</title>
<link rel="stylesheet" href="discord.css">
</head>
<body>
<div class="app">
  <div class="channel-header">
    <span class="hash">#</span>
    <span class="name">orders</span>
    <span class="divider"></span>
    <span class="topic">Order tracking &amp; team reminders — Demo Workspace</span>
  </div>

  <div class="messages">

    <!-- /order_status -->
    <div class="msg-group">
      <div class="avatar av-sara">SL</div>
      <div class="msg-body">
        <div class="slash-used">
          <span class="slash-icon">/</span>
          <span class="uname-sara username">sara.lee</span> used
          <span class="slash-cmd">/order_status</span>
          <span class="timestamp">Today at 10:47 AM</span>
        </div>
        <div class="msg-header">
          <span class="uname-bot username">OpsBot</span>
          <span class="bot-tag">APP</span>
        </div>
        <div class="msg-text"><b>Order Status:</b> <b>Order #10482 - Aria Table Lamp</b> found in list <b>In Progress</b>.</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
