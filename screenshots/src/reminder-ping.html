<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>reminder-ping</title>
<link rel="stylesheet" href="discord.css">
</head>
<body>
<div class="app">
  <div class="channel-header">
    <span class="hash">#</span>
    <span class="name">orders</span>
    <span class="divider"></span>
    <span class="topic">Order tracking &amp; team reminders — Demo Workspace</span>
  </div>

  <div class="messages">

    <!-- reminder firing -->
    <div class="msg-group">
      <div class="avatar av-bot">OB</div>
      <div class="msg-body">
        <div class="msg-header">
          <span class="uname-bot username">OpsBot</span>
          <span class="bot-tag">APP</span>
          <span class="timestamp">Today at 2:30 PM</span>
        </div>
        <div class="msg-text"><span class="mention">@sara.lee</span> <b>Reminder:</b> Confirm shipment for order #10482 with carrier</div>
      </div>
    </div>

    <!-- missed reminder on startup -->
    <div class="msg-group">
      <div class="avatar av-bot">OB</div>
      <div class="msg-body">
        <div class="msg-header">
          <span class="uname-bot username">OpsBot</span>
          <span class="bot-tag">APP</span>
          <span class="timestamp">Today at 9:02 AM</span>
        </div>
        <div class="msg-text"><span class="mention">@alex.morgan</span> <b>Missed Reminder:</b> Follow up with warehouse on backorder (was due at 26 Sep 2026 18:30 PKT)</div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
